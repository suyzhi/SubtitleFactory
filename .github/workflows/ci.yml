name: v1-quality-gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-12
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Verify synchronized versions
        run: python scripts/check-versions.py
      - name: Verify App Store metadata
        run: python scripts/verify-app-store-metadata.py
      - name: Verify macOS deployment-target gate
        run: |
          scripts/verify-macos-deployment-target.sh /usr/bin/true 99.0
          if scripts/verify-macos-deployment-target.sh /usr/bin/true 1.0; then
            echo "Deployment-target gate accepted an intentionally incompatible binary." >&2
            exit 1
          fi
      - name: Backend tests
        run: python -m pytest -q backend/tests
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Frontend tests
        working-directory: frontend
        run: npm test
      - name: Frontend production build
        working-directory: frontend
        run: npm run build
      - name: Prepare Tauri resource directory
        run: mkdir -p frontend/src-tauri/backend-runtime
      - name: Rust check
        run: cargo check --locked --manifest-path frontend/src-tauri/Cargo.toml
      - name: Generate SBOM and license inventory
        run: python scripts/generate-sbom.py
      - name: Verify committed supply-chain inventory
        run: git diff --exit-code -- artifacts
      - name: Clean generated build products
        if: always()
        run: |
          rm -rf frontend/dist
          rm -rf frontend/src-tauri/target
          rm -rf frontend/src-tauri/backend-runtime
          rm -rf backend/build backend/dist
          find backend frontend -type d \( -name .pytest_cache -o -name __pycache__ \) -prune -exec rm -rf {} +
