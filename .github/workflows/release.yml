name: release-package

# 发布流水线：在 Apple Silicon (arm64) macOS runner 上执行完整打包验收，
# 生成根目录 App/DMG 并上传构建产物。scripts/package-app.sh 内置全部
# 质量门（测试、lint、标记检查、运行时校验、DMG 内外哈希对比、真实启动验收）。
#
# runner 标签可配置：GitHub arm64 macOS runner 的标签随可用区与账户计划变化，
# 默认使用 macos-14-arm64；若该标签不可用，通过 workflow_dispatch 传入
# 实际 arm64 标签（架构闸门会在打包前复核 uname -m）。
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "arm64 macOS runner 标签（必须 Apple Silicon）"
        default: "macos-14-arm64"
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    runs-on: ${{ github.event.inputs.runner || 'macos-14-arm64' }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 架构闸门
        run: |
          if [ "$(uname -s)" != "Darwin" ] || [ "$(uname -m)" != "arm64" ]; then
            echo "发布打包要求 Apple Silicon (arm64) macOS runner，当前为 $(uname -s) / $(uname -m)。" >&2
            echo "请通过 workflow_dispatch 选择 arm64 runner 标签后重试。" >&2
            exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-12

      - name: 准备后端虚拟环境
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -q -U pip
          backend/.venv/bin/python -m pip install -q -r backend/requirements-dev.txt

      - name: 安装 Deno（direct 渠道下载器运行时）
        run: |
          curl -fsSL https://deno.land/install.sh | sh -s -- -y
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 准备 FFmpeg LGPL arm64 发布运行时
        run: ./scripts/fetch-ffmpeg.sh

      - name: 完整打包与验收
        run: ./scripts/package-app.sh

      # 仓库其余 workflow 采用完整 SHA 固定；此 action 因当前环境无法
      # 核对发行 SHA，暂按主版本标签固定（仅用于构建产物上传）。
      - name: 上传 DMG 与校验文件
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-factory-${{ github.ref_name }}-aarch64
          path: |
            字幕工厂_*_aarch64.dmg
            字幕工厂_*_aarch64.dmg.sha256
          if-no-files-found: error
